<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login para Cadastro</title>
  <link rel="stylesheet" href="./Styles/cadastro.css"> <!-- Reaproveitando seu CSS -->
</head>

<body>
  <div class="container">
    <h1>Login</h1>
    <form id="loginForm">
      <div class="form-group">
        <label for="usuário">Nome usuário:</label>
        <input type="text" id="User" name="User" placeholder="Usuário" required>
      </div>
      <div class="form-group">
        <label for="password">Senha:</label>
        <input type="password" id="password" name="password" placeholder="Senha" required>
      </div>
      <div class="btns-cadastro">
        <button type="button"><a href="./index.html">Voltar</a></button>
        <button type="submit">Entrar</button>
      </div>
    </form>
    <p id="message" style="color: #F4B060;"></p>
  </div>

  <script src="./JS/login.js"></script>
</body>

</html>
