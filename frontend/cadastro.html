<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Veículos</title>
  <link rel="stylesheet" href="./Styles/cadastro.css">
</head>

<body>
  <div class="container">
    <h1>Cadastro de Veículos</h1>
    <form id="cadastroForm">
      <div class="form-group">
        <label for="fotos">URLs das Fotos:</label>
        <input type="text" id="fotos" placeholder="Insira as URLs separadas por vírgula">
      </div>
      <div class="form-group">
        <label for="descricao">Descrição:</label>
        <input type="text" id="descricao" placeholder="Descrição">
      </div>
      <div class="form-group">
        <label for="modelo">Modelo:</label>
        <input type="text" id="modelo" placeholder="Modelo">
      </div>
      <div class="form-group">
        <label for="ano">Ano:</label>
        <input type="text" id="ano" placeholder="Ano">
      </div>
      <div class="form-group">
        <label for="km">Km Rodado:</label>
        <input type="text" id="km" placeholder="Km Rodado">
      </div>
      <div class="form-group">
        <label for="preco">Preço:</label>
        <input type="text" id="preco" placeholder="Preço">
      </div>
      <div class="btns-cadastro">
        <button type="button"><a href="./anuncios.html">Voltar</a></button>
        <button type="submit">Cadastrar</button>
        <button id="publicarBtn">Publicar Veículo Cadastrado</button>
      </div>
    </form>

    <div id="boxsContainer"></div>
  </div>


  <script type="module" src="./JS/cadastrar.js"></script>
</body>

</html>
